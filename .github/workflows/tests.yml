name: JobLens CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: joblens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest httpx slowapi sentence-transformers fastapi uvicorn sqlalchemy psycopg2-binary redis pydantic python-dotenv numpy

      - name: Enable pgvector Extension in Test DB
        run: |
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d joblens_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run Backend Test Suite
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/joblens_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          SIGNUP_INVITE_TOKEN: joblens-beta-2026
        run: |
          python backend/test_ingestion.py
          python backend/test_signup.py
          python backend/test_rate_limiting.py
          python backend/test_applications.py
          python backend/test_dashboard.py
